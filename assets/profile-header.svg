<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shreyas-84524 profile banner</title>
  <desc id="desc">A blue and cyan developer dashboard banner for Shreyas-84524 from Mumbai.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#0A1626"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="border" x1="30" y1="20" x2="970" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#39D353"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#39D353"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="skewX(-20)">
      <path d="M22 0H0V22" stroke="#58A6FF" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .spark { animation: blink 2.4s ease-in-out infinite; }
      .spark-delayed { animation: blink 2.4s 1.2s ease-in-out infinite; }
      .cursor { animation: cursor 1s steps(2, end) infinite; }
      .bar { transform-box: fill-box; transform-origin: center bottom; animation: rise 4s ease-in-out infinite alternate; }
      .bar:nth-of-type(2n) { animation-delay: -1.3s; }
      .bar:nth-of-type(3n) { animation-delay: -2.4s; }
      @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      @keyframes cursor { 50% { opacity: 0; } }
      @keyframes rise { from { transform: scaleY(.72); opacity: .62; } to { transform: scaleY(1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .spark, .spark-delayed, .cursor, .bar { animation: none; } }
    </style>
  </defs>

  <rect width="1000" height="300" rx="24" fill="url(#background)"/>
  <rect x="12" y="12" width="976" height="276" rx="18" stroke="url(#border)" stroke-width="2" filter="url(#glow)"/>
  <rect x="26" y="26" width="948" height="248" rx="14" stroke="#30363D"/>

  <circle class="spark" cx="54" cy="55" r="3" fill="#00D9FF"/>
  <circle class="spark-delayed" cx="590" cy="60" r="3" fill="#39D353"/>
  <path class="spark" d="M628 40v14M621 47h14" stroke="#E6EDF3" stroke-width="2"/>
  <path class="spark-delayed" d="M935 62v12M929 68h12" stroke="#FF66C4" stroke-width="2"/>

  <text x="62" y="76" class="mono" font-size="19" font-weight="600" fill="#39D353">@Shreyas-84524</text>
  <text x="62" y="130" class="mono" font-size="44" font-weight="800" fill="#E6EDF3">Shreyas-84524</text>
  <rect x="62" y="149" width="472" height="2" rx="1" fill="url(#border)" opacity=".7"/>
  <text x="62" y="181" class="mono" font-size="18" fill="#C9D1D9">TSEC 29'  |  AI &amp; ML  |  UI/UX  |  App Development</text>
  <text x="62" y="215" class="mono" font-size="16" fill="#8B949E">⌖ Mumbai, MH</text>

  <g class="mono" font-size="14" font-weight="600">
    <rect x="62" y="234" width="128" height="31" rx="8" fill="#161B22" stroke="#58A6FF" stroke-opacity=".65"/>
    <circle cx="80" cy="249.5" r="5" fill="#58A6FF"/><text x="94" y="255" fill="#C9D1D9">Flutter</text>
    <rect x="200" y="234" width="118" height="31" rx="8" fill="#161B22" stroke="#00D9FF" stroke-opacity=".65"/>
    <circle cx="218" cy="249.5" r="5" fill="#00D9FF"/><text x="232" y="255" fill="#C9D1D9">Python</text>
    <rect x="328" y="234" width="103" height="31" rx="8" fill="#161B22" stroke="#F89820" stroke-opacity=".7"/>
    <circle cx="346" cy="249.5" r="5" fill="#F89820"/><text x="360" y="255" fill="#C9D1D9">Java</text>
    <rect x="441" y="234" width="112" height="31" rx="8" fill="#161B22" stroke="#A97BFF" stroke-opacity=".7"/>
    <circle cx="459" cy="249.5" r="5" fill="#A97BFF"/><text x="473" y="255" fill="#C9D1D9">Kotlin</text>
  </g>

  <g transform="translate(625 78)">
    <path d="M0 147L142 70L300 147L158 224Z" fill="url(#grid)"/>
    <g fill="url(#city)" stroke="#54FFF2" stroke-width="1.2" filter="url(#glow)">
      <rect class="bar" x="50" y="118" width="20" height="55" rx="2"/>
      <rect class="bar" x="78" y="92" width="20" height="96" rx="2"/>
      <rect class="bar" x="106" y="132" width="20" height="71" rx="2"/>
      <rect class="bar" x="134" y="48" width="20" height="163" rx="2"/>
      <rect class="bar" x="162" y="106" width="20" height="99" rx="2"/>
      <rect class="bar" x="190" y="72" width="20" height="116" rx="2"/>
      <rect class="bar" x="218" y="123" width="20" height="50" rx="2"/>
      <rect class="bar" x="246" y="98" width="20" height="60" rx="2"/>
    </g>
    <text x="52" y="24" class="mono" font-size="15" fill="#58A6FF">contributions.render()</text>
    <text x="268" y="24" class="mono cursor" font-size="15" fill="#39D353">_</text>
  </g>
</svg>
